    const q = search.toLowerCase();
    const matchSearch = !q || e.name.toLowerCase().includes(q) || e.id.toLowerCase().includes(q) || e.dept.toLowerCase().includes(q);
    const matchTab = activeTab === 0 ? true : activeTab === 1 ? e.status === "active" : activeTab === 2 ? e.status === "pending" : e.status === "inactive";
    return matchSearch && matchTab;
  });

  const toggleRow = id => {
    const next = new Set(selectedRows);
    next.has(id) ? next.delete(id) : next.add(id);
    setSelectedRows(next);
  };

  const statusLabel = s => ({ active: "Đang làm việc", pending: "Chờ duyệt", inactive: "Đã nghỉ" }[s]);
  const statusClass = s => ({ active: "status-active", pending: "status-pending", inactive: "status-inactive" }[s]);
  const initials = name => name.split(" ").map(w => w[0]).slice(-2).join("").toUpperCase();

  const handleSave = () => {
    setShowModal(false);
    setModalStep(1);
    setShowAlert(true);
    setTimeout(() => setShowAlert(false), 3500);
  };

  return (
    <div className="app">
      {/* Sidebar */}
      <div className={`sidebar${sidebarMini ? " mini" : ""}`}>
        <div className="sidebar-header">
          <div className="sidebar-logo"><span>MB</span></div>
          {!sidebarMini && (
            <div className="sidebar-title">
              <div className="top">HCM · HRIS</div>
              <div className="sub">Quản lý nhân sự</div>
            </div>
          )}
          <button className="toggle-sidebar" onClick={() => setSidebarMini(v => !v)}>
            <SVGIcon path={ICONS.menu} size={16} />
          </button>
        </div>
        <div className="sidebar-nav">
          {!sidebarMini && <div className="nav-section">Modules</div>}
          {modules.map((m, i) => (
            <div key={i} className={`nav-item${activeModule === i ? " active" : ""}`} onClick={() => setActiveModule(i)}>
              <div className="icon" style={{ fontSize: 18 }}>{m.icon}</div>
              {!sidebarMini && <span className="label">{m.label}</span>}
              {!sidebarMini && i === 2 && <span className="badge">3</span>}
            </div>
          ))}
        </div>
        <div className="sidebar-footer">
          <div className="avatar-sm"><span>NT</span></div>
          {!sidebarMini && (
            <div style={{ overflow: "hidden" }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: "#14142A", whiteSpace: "nowrap" }}>Nguyễn Thành</div>
              <div style={{ fontSize: 11, color: "#A0A3BD" }}>Quản trị viên</div>
            </div>
          )}
        </div>
      </div>

      {/* Main */}
      <div className="main">
        <div className="header">
          <div className="header-title">Quản lý nhân sự</div>
          <div className="header-actions">
            <button className="btn btn-outline btn-sm">
              <SVGIcon path={ICONS.download} size={15} />
              Xuất Excel
            </button>
            <button className="icon-btn notification-dot" title="Thông báo">
              <SVGIcon path={ICONS.bell} size={18} />
            </button>
            <div className="avatar-sm" style={{ cursor: "pointer" }}><span>NT</span></div>
          </div>
        </div>

        <div className="content">
          {/* Breadcrumb */}
          <div className="breadcrumb">
            <a>Trang chủ</a>
            <span>›</span>
            <a>Nhân sự</a>
            <span>›</span>
            Danh sách nhân viên
          </div>

          {/* Alert */}
          {showAlert && (
            <div className="alert-banner success">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="#00BA88"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
              <div className="alert-content">
                <div className="title" style={{ color: "#00966D" }}>Thêm nhân viên thành công</div>
                <div className="desc">Hồ sơ nhân viên mới đã được tạo và đang chờ phê duyệt.</div>
              </div>
            </div>
          )}

          {/* Stats */}
          <div className="stats-grid">
            {[
              { label: "Tổng nhân viên", value: "1,248", change: "+12 tháng này", color: "#141ED2", bg: "#E8EAF6", icon: ICONS.person },
              { label: "Đang làm việc", value: "1,187", change: "95.1% tổng số", color: "#00966D", bg: "#F2FFFB", icon: ICONS.check },
              { label: "Chờ phê duyệt", value: "23", change: "3 cần xử lý gấp", color: "#946200", bg: "#FFF9EF", icon: ICONS.refresh },
              { label: "Đã nghỉ việc", value: "38", change: "Tháng 6/2026", color: "#EB2D4B", bg: "#FFF3F8", icon: ICONS.close },
            ].map((s, i) => (
              <div className="stat-card" key={i}>
                <div className="stat-icon" style={{ background: s.bg, color: s.color }}>
                  <SVGIcon path={s.icon} size={20} />
                </div>
                <div className="stat-label">{s.label}</div>
                <div className="stat-value" style={{ color: s.color }}>{s.value}</div>
                <div className="stat-change" style={{ color: s.color }}>{s.change}</div>
              </div>
            ))}
          </div>

          {/* Page header */}
          <div className="page-header">
            <div>
              <div className="page-title">Danh sách nhân viên</div>
            </div>
            <div className="page-actions">
              <button className="btn btn-ghost btn-sm">
                <SVGIcon path={ICONS.filter} size={15} />
                Bộ lọc
              </button>
              <button className="btn btn-primary" onClick={() => { setShowModal(true); setModalStep(1); }}>
                <SVGIcon path={ICONS.add} size={16} />
                Thêm nhân viên
              </button>
            </div>
          </div>

          {/* Tabs + Search */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 0 }}>
            <div className="tabs" style={{ marginBottom: 0, flex: 1 }}>
              {tabs.map((t, i) => (
                <div key={i} className={`tab${activeTab === i ? " active" : ""}`} onClick={() => setActiveTab(i)}>
                  {t}
                  {i === 2 && <span style={{ marginLeft: 6, background: "#F4B740", color: "#fff", borderRadius: "9999px", fontSize: 10, fontWeight: 700, padding: "1px 6px" }}>23</span>}
                </div>
              ))}
            </div>
            <div className="search-bar" style={{ marginBottom: 0 }}>
              <svg className="search-icon" viewBox="0 0 24 24" fill="currentColor"><path d={ICONS.search} /></svg>
              <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Tìm nhân viên, mã NV..." />
            </div>
          </div>

          {/* Filter bar */}
          <div className="filter-bar" style={{ marginTop: 12 }}>
            <select className="select-field"><option>Tất cả phòng ban</option><option>Phòng Kế toán</option><option>Phòng Nhân sự</option><option>Phòng CNTT</option></select>
            <select className="select-field"><option>Tất cả chức danh</option><option>Kế toán trưởng</option><option>Chuyên viên</option><option>Quản lý</option></select>
            <select className="select-field"><option>Năm 2026</option><option>Năm 2025</option><option>Năm 2024</option></select>
            {search && <div className="filter-chip active" onClick={() => setSearch("")}>"{search}" ✕</div>}
          </div>

          {/* Table */}
          <div className="table-wrap">
            <table className="table">
              <thead>
                <tr>
                  <th style={{ width: 44 }}>
                    <input type="checkbox" style={{ accentColor: "#141ED2", cursor: "pointer" }} onChange={() => {}} />
                  </th>
                  <th>Nhân viên</th>
                  <th>Mã NV</th>
                  <th>Phòng ban</th>
                  <th>Chức danh</th>
                  <th>Ngày vào làm</th>
                  <th>Trạng thái</th>
                  <th style={{ width: 100 }}>Thao tác</th>
                </tr>
              </thead>
              <tbody>
                {filtered.length === 0 ? (
                  <tr><td colSpan={8} style={{ textAlign: "center", padding: "40px", color: "#A0A3BD" }}>
                    Không tìm thấy nhân viên nào
                  </td></tr>
                ) : filtered.map(e => (
                  <tr key={e.id}>
                    <td>
                      <input type="checkbox" checked={selectedRows.has(e.id)} onChange={() => toggleRow(e.id)} style={{ accentColor: "#141ED2", cursor: "pointer" }} />
                    </td>
                    <td>
                      <div className="user-cell">
                        <div className="avatar-md" style={{ background: e.color }}>{initials(e.name)}</div>
                        <div>
                          <div className="user-name">{e.name}</div>
                          <div className="user-code">{e.id}</div>
                        </div>
                      </div>
                    </td>
                    <td style={{ fontFamily: "monospace", fontSize: 12, color: "#6E7191" }}>{e.id}</td>
                    <td>{e.dept}</td>
                    <td>{e.position}</td>
                    <td style={{ color: "#6E7191" }}>{e.join}</td>
                    <td><span className={`status ${statusClass(e.status)}`}>{statusLabel(e.status)}</span></td>
                    <td>
                      <div style={{ display: "flex", gap: 4 }}>
                        <button className="icon-btn" style={{ width: 28, height: 28 }} title="Xem chi tiết">
                          <SVGIcon path="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" size={15} />
                        </button>
                        <button className="icon-btn" style={{ width: 28, height: 28 }} title="Chỉnh sửa">
                          <SVGIcon path={ICONS.edit} size={14} />
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="pagination">
              <div className="pagination-info">Hiển thị 1–{filtered.length} / {employees.length} nhân viên</div>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <select className="select-field" style={{ height: 28, fontSize: 12 }}>
                  <option>10 / trang</option><option>20 / trang</option><option>50 / trang</option>
                </select>
                <div className="pagination-btns">
                  {["‹", "1", "2", "3", "›"].map((p, i) => (
                    <button key={i} className={`page-btn${(i === 1) ? " active" : ""}`} onClick={() => setCurrentPage(i)}>{p}</button>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* Modal — Add Employee */}
      {showModal && (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setShowModal(false)}>
          <div className="modal">
            <div className="modal-header">
              <div className="modal-title">Thêm nhân viên mới</div>
              <button className="modal-close" onClick={() => setShowModal(false)}>
                <SVGIcon path={ICONS.close} size={18} />
              </button>
            </div>
            <div className="modal-body">
              {/* Steps */}
              <div className="steps">
                <div className="step">
                  <div className={`step-circle ${modalStep > 1 ? "done" : "active"}`}>{modalStep > 1 ? "✓" : "1"}</div>
                  <span className={`step-label${modalStep === 1 ? " active" : ""}`}>Thông tin cơ bản</span>
                </div>
                <div className={`step-line${modalStep > 1 ? " done" : ""}`} />
                <div className="step">
                  <div className={`step-circle ${modalStep > 2 ? "done" : modalStep === 2 ? "active" : "pending"}`}>{modalStep > 2 ? "✓" : "2"}</div>
                  <span className={`step-label${modalStep === 2 ? " active" : ""}`}>Vị trí công tác</span>
                </div>
                <div className={`step-line${modalStep > 2 ? " done" : ""}`} />
                <div className="step">
                  <div className={`step-circle ${modalStep === 3 ? "active" : "pending"}`}>3</div>
                  <span className={`step-label${modalStep === 3 ? " active" : ""}`}>Xác nhận</span>
                </div>
              </div>

              {modalStep === 1 && (
                <div>
                  <div className="form-row">
                    <div className="form-group"><label className="form-label">Họ và tên *</label><input className="form-input" placeholder="Nguyễn Văn A" /></div>
                    <div className="form-group"><label className="form-label">Mã nhân viên</label><input className="form-input" placeholder="Tự động tạo" disabled style={{ background: "#F4F6FA", color: "#A0A3BD" }} /></div>
                  </div>
                  <div className="form-row">
                    <div className="form-group"><label className="form-label">Ngày sinh *</label><input className="form-input" type="date" /></div>
                    <div className="form-group"><label className="form-label">Giới tính</label>
                      <select className="form-select"><option>Nam</option><option>Nữ</option><option>Khác</option></select>
                    </div>
                  </div>
                  <div className="form-row">
                    <div className="form-group"><label className="form-label">Email công ty *</label><input className="form-input" placeholder="tennv@mbbank.com.vn" /></div>
                    <div className="form-group"><label className="form-label">Số điện thoại</label><input className="form-input" placeholder="0912 345 678" /></div>
                  </div>
                  <div className="form-row">
                    <div className="form-group full"><label className="form-label">Địa chỉ thường trú</label><input className="form-input" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành phố" /></div>
                  </div>
                </div>
              )}

              {modalStep === 2 && (
                <div>
                  <div className="form-row">
                    <div className="form-group"><label className="form-label">Phòng ban *</label>
                      <select className="form-select"><option>-- Chọn phòng ban --</option><option>Phòng Kế toán</option><option>Phòng Nhân sự</option><option>Phòng CNTT</option><option>Phòng Kinh doanh</option></select>
                    </div>
                    <div className="form-group"><label className="form-label">Chức danh *</label>
                      <select className="form-select"><option>-- Chọn chức danh --</option><option>Nhân viên</option><option>Chuyên viên</option><option>Trưởng nhóm</option><option>Phó phòng</option><option>Trưởng phòng</option></select>
                    </div>
                  </div>
                  <div className="form-row">
                    <div className="form-group"><label className="form-label">Ngày vào làm *</label><input className="form-input" type="date" /></div>
                    <div className="form-group"><label className="form-label">Loại hợp đồng</label>
                      <select className="form-select"><option>Thử việc</option><option>Xác định thời hạn</option><option>Không xác định thời hạn</option></select>
                    </div>
                  </div>
                  <div className="form-row">
                    <div className="form-group"><label className="form-label">Hệ số lương</label><input className="form-input" placeholder="3.00" /></div>
                    <div className="form-group"><label className="form-label">Ngân hàng nhận lương</label>
                      <select className="form-select"><option>MB Bank</option><option>Vietcombank</option><option>Techcombank</option></select>
                    </div>
                  </div>
                </div>
              )}

              {modalStep === 3 && (
                <div style={{ textAlign: "center", padding: "20px 0" }}>
                  <div style={{ width: 64, height: 64, borderRadius: "50%", background: "#F2FFFB", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 16px" }}>
                    <svg width={32} height={32} viewBox="0 0 24 24" fill="#00BA88"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                  </div>
                  <div style={{ fontSize: 16, fontWeight: 700, color: "#14142A", marginBottom: 8 }}>Xác nhận tạo hồ sơ</div>
                  <div style={{ fontSize: 13, color: "#6E7191", marginBottom: 20 }}>Thông tin nhân viên mới sẽ được lưu và gửi đến quản lý để phê duyệt.</div>
                  <div style={{ background: "#F4F6FA", borderRadius: 8, padding: "16px 20px", textAlign: "left" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
                      <span style={{ fontSize: 12, color: "#6E7191" }}>Trạng thái</span>
                      <span className="status status-pending">Chờ phê duyệt</span>
                    </div>
                    <div style={{ display: "flex", justifyContent: "space-between" }}>
                      <span style={{ fontSize: 12, color: "#6E7191" }}>Người tạo</span>
                      <span style={{ fontSize: 12, fontWeight: 600, color: "#4E4B66" }}>Nguyễn Thành (Admin)</span>
                    </div>
                  </div>
                </div>
              )}
            </div>
            <div className="modal-footer">
              {modalStep > 1 && <button className="btn btn-ghost" onClick={() => setModalStep(s => s - 1)}>← Quay lại</button>}
              <button className="btn btn-ghost" onClick={() => setShowModal(false)}>Hủy</button>
              {modalStep < 3
                ? <button className="btn btn-primary" onClick={() => setModalStep(s => s + 1)}>Tiếp theo →</button>
                : <button className="btn btn-primary" onClick={handleSave}>
                    <SVGIcon path={ICONS.check} size={16} />
                    Xác nhận tạo
                  </button>
              }
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body></html>
