<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px base grid — 0 through 96px" -->
<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--color-bg-surface); font-family: var(--font-family-body); }
  .row { display: flex; gap: 0; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-right: 12px; }
  .bar { background: var(--color-bg-brand); border-radius: 3px; width: 28px; opacity: 0.85; }
  .label { font-size: 9px; font-weight: 600; color: var(--color-text-muted); text-align: center; line-height: 1.3; }
  .label span { display: block; color: var(--color-text-secondary); font-size: 10px; }
</style>
</head><body>
<div class="row">
  <div class="item"><div class="bar" style="height:4px"></div><div class="label"><span>4px</span>–1</div></div>
  <div class="item"><div class="bar" style="height:8px"></div><div class="label"><span>8px</span>–2</div></div>
  <div class="item"><div class="bar" style="height:12px"></div><div class="label"><span>12px</span>–3</div></div>
  <div class="item"><div class="bar" style="height:16px"></div><div class="label"><span>16px</span>–4</div></div>
  <div class="item"><div class="bar" style="height:20px"></div><div class="label"><span>20px</span>–5</div></div>
  <div class="item"><div class="bar" style="height:24px"></div><div class="label"><span>24px</span>–6</div></div>
  <div class="item"><div class="bar" style="height:28px"></div><div class="label"><span>28px</span>–7</div></div>
  <div class="item"><div class="bar" style="height:32px"></div><div class="label"><span>32px</span>–8</div></div>
  <div class="item"><div class="bar" style="height:40px"></div><div class="label"><span>40px</span>–10</div></div>
  <div class="item"><div class="bar" style="height:48px"></div><div class="label"><span>48px</span>–12</div></div>
  <div class="item"><div class="bar" style="height:64px"></div><div class="label"><span>64px</span>–16</div></div>
  <div class="item"><div class="bar" style="height:80px;opacity:0.5"></div><div class="label"><span>80px</span>–20</div></div>
</div>
</body></html>
