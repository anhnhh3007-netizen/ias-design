<!-- @dsCard group="Colors" viewport="700x160" name="Accent Violet" subtitle="Secondary brand violet scale" -->
<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--color-bg-surface); font-family: var(--font-family-body); }
  .row { display: flex; gap: 6px; }
  .swatch { flex: 1; height: 72px; border-radius: 8px; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 8px; }
  .swatch span { font-size: 10px; font-weight: 600; line-height: 1.3; }
  .swatch .name { color: rgba(255,255,255,0.75); }
  .swatch .hex  { color: rgba(255,255,255,0.95); }
  .swatch.light .name, .swatch.light .hex { color: rgba(20,20,42,0.55); }
  .label { font-size: 11px; font-weight: 600; color: var(--color-neutral-500); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 8px; }
</style>
</head><body>
<div class="label">Accent / Secondary</div>
<div class="row">
  <div class="swatch" data-token="--color-accent-700" style="background:var(--color-accent-700)"><span class="name">700</span><span class="hex"></span></div>
  <div class="swatch" data-token="--color-accent-500" style="background:var(--color-accent-500)"><span class="name">500 ★</span><span class="hex"></span></div>
  <div class="swatch" data-token="--color-accent-300" style="background:var(--color-accent-300)"><span class="name">300</span><span class="hex"></span></div>
  <div class="swatch" data-token="--color-accent-200" style="background:var(--color-accent-200)"><span class="name">200</span><span class="hex"></span></div>
  <div class="swatch light" data-token="--color-accent-100" style="background:var(--color-accent-100); border:1px solid var(--color-border-default)"><span class="name">100</span><span class="hex"></span></div>
  <div class="swatch" data-token="--color-info-500" style="background:var(--color-info-500)"><span class="name">Info 500</span><span class="hex"></span></div>
  <div class="swatch light" data-token="--color-info-100" style="background:var(--color-info-100); border:1px solid var(--color-border-default)"><span class="name">Info 100</span><span class="hex"></span></div>
</div>
<script src="resolve-token.js"></script>
</body></html>
