<!-- @dsCard group="Colors" viewport="700x160" name="Semantic" subtitle="Success · Error · Warning · Alert" -->
<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--color-bg-surface); font-family: var(--font-family-body); }
  .row { display: flex; gap: 8px; }
  .group { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .group-label { font-size: 10px; font-weight: 700; color: var(--color-neutral-500); letter-spacing: 0.6px; text-transform: uppercase; margin-bottom: 4px; }
  .swatch { height: 40px; border-radius: 6px; display: flex; align-items: center; padding: 0 8px; font-size: 10px; font-weight: 600; }
  .swatch.dark { color: rgba(255,255,255,0.9); }
  .swatch.light { border: 1px solid rgba(0,0,0,0.08); color: rgba(20,20,42,0.55); }
</style>
</head><body>
<div class="row">
  <div class="group">
    <div class="group-label">Success</div>
    <div class="swatch dark" data-token="--color-success-700" style="background:var(--color-success-700)"><span class="hex"></span></div>
    <div class="swatch dark" data-token="--color-success-500" style="background:var(--color-success-500)"><span class="hex"></span>&nbsp;★</div>
    <div class="swatch light" data-token="--color-success-100" style="background:var(--color-success-100)"><span class="hex"></span></div>
  </div>
  <div class="group">
    <div class="group-label">Error</div>
    <div class="swatch dark" data-token="--color-error-700" style="background:var(--color-error-700)"><span class="hex"></span></div>
    <div class="swatch dark" data-token="--color-error-500" style="background:var(--color-error-500)"><span class="hex"></span>&nbsp;★</div>
    <div class="swatch light" data-token="--color-error-100" style="background:var(--color-error-100)"><span class="hex"></span></div>
  </div>
  <div class="group">
    <div class="group-label">Warning</div>
    <div class="swatch dark" data-token="--color-warning-700" style="background:var(--color-warning-700)"><span class="hex"></span></div>
    <div class="swatch dark" data-token="--color-warning-500" style="background:var(--color-warning-500)"><span class="hex"></span>&nbsp;★</div>
    <div class="swatch light" data-token="--color-warning-100" style="background:var(--color-warning-100)"><span class="hex"></span></div>
  </div>
  <div class="group">
    <div class="group-label">Alert</div>
    <div class="swatch dark" data-token="--color-alert-500" style="background:var(--color-alert-500)"><span class="hex"></span>&nbsp;★</div>
    <div class="swatch dark" data-token="--color-alert-400" style="background:var(--color-alert-400)"><span class="hex"></span></div>
    <div class="swatch light" data-token="--color-alert-100" style="background:var(--color-alert-100)"><span class="hex"></span></div>
  </div>
</div>
<script src="resolve-token.js"></script>
</body></html>
