<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../../styles.css">
<style>body{margin:0;padding:14px 20px;background:#fff;font-family:var(--font-family-body);display:flex;gap:24px;align-items:center;font-size:13px;color:#4E4B66}
.tg{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.tr{width:36px;height:20px;border-radius:10px;position:relative;flex-shrink:0}
.th{width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);position:absolute;top:2px;transition:left .2s}
</style></head><body>
<span class="tg"><span class="tr" style="background:#D9DBE9"><span class="th" style="left:2px"></span></span>Tắt</span>
<span class="tg"><span class="tr" style="background:#141ED2"><span class="th" style="left:18px"></span></span>Bật</span>
<span class="tg" style="opacity:.4"><span class="tr" style="background:#D9DBE9"><span class="th" style="left:2px"></span></span>Vô hiệu</span>
<span class="tg"><span class="tr" style="background:#00BA88"><span class="th" style="left:18px"></span></span>Kích hoạt</span>
</body></html>
