<!-- @dsCard group="Components" viewport="700x140" name="Textarea" subtitle="Multi-line text input with states" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../../styles.css">
<style>body{margin:0;padding:16px 20px;background:#fff;font-family:var(--font-family-body);display:flex;gap:16px}
.fg{flex:1;display:flex;flex-direction:column;gap:6px}
label{font-size:12px;font-weight:600;color:#4E4B66}
textarea{border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;resize:vertical;outline:none;width:100%;box-sizing:border-box;line-height:1.5}
</style></head><body>
<div class="fg"><label>Lý do điều chỉnh</label><textarea rows="4" style="border:1px solid #D9DBE9;color:#4E4B66" placeholder="Nhập lý do..."></textarea></div>
<div class="fg"><label>Ghi chú (focus)</label><textarea rows="4" style="border:2px solid #141ED2;color:#4E4B66;box-shadow:0 0 0 3px rgba(20,30,210,.08)">Cần điều chỉnh vì...</textarea></div>
<div class="fg"><label>Lỗi</label><textarea rows="4" style="border:2px solid #EB2D4B;color:#4E4B66" placeholder="Bắt buộc nhập"></textarea><span style="font-size:11px;color:#EB2D4B">Vui lòng nhập lý do</span></div>
</body></html>
