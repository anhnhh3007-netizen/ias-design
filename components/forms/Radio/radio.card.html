<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../../styles.css">
<style>body{margin:0;padding:14px 20px;background:#fff;font-family:var(--font-family-body);display:flex;gap:20px;align-items:center;font-size:13px;color:#4E4B66}
.rb{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.dot{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style></head><body>
<span class="rb"><span class="dot" style="border:2px solid #D9DBE9;background:#fff"></span>Không chọn</span>
<span class="rb"><span class="dot" style="border:2px solid #141ED2;background:#fff"><span style="width:8px;height:8px;border-radius:50%;background:#141ED2;display:block"></span></span>Đã chọn</span>
<span class="rb"><span class="dot" style="border:2px solid #141ED2;background:#fff"><span style="width:8px;height:8px;border-radius:50%;background:#141ED2;display:block"></span></span>Nam</span>
<span class="rb"><span class="dot" style="border:2px solid #D9DBE9;background:#fff"></span>Nữ</span>
<span class="rb" style="opacity:.4"><span class="dot" style="border:2px solid #D9DBE9;background:#F4F6FA"></span>Vô hiệu</span>
</body></html>
