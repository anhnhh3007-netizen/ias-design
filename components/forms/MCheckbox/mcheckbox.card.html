<!-- @dsCard group="Components" viewport="700x80" name="MCheckbox" subtitle="[M]Checkbox — Figma Material checkbox all states" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../../styles.css">
<style>body{margin:0;padding:16px 20px;background:#fff;font-family:var(--font-family-body);display:flex;gap:20px;align-items:center;flex-wrap:wrap;font-size:13px;color:#4E4B66}
.cb{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.bx{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style></head><body>
<span class="cb"><span class="bx" style="border:2px solid #A0A3BD;background:#fff"></span>Unchecked</span>
<span class="cb"><span class="bx" style="border:2px solid #141ED2;background:#141ED2"><svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Checked</span>
<span class="cb"><span class="bx" style="border:2px solid #141ED2;background:#141ED2"><span style="width:8px;height:2px;background:#fff;border-radius:1px;display:block"></span></span>Indeterminate</span>
<span class="cb"><span class="bx" style="border:2px solid #141ED2;background:#fff;box-shadow:0 0 0 3px rgba(20,30,210,.1)"></span>Hovering</span>
<span class="cb" style="opacity:.5"><span class="bx" style="border:2px solid #D9DBE9;background:#fff"></span>Disabled</span>
</body></html>
