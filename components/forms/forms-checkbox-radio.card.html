<!-- @dsCard group="Components" viewport="700x180" name="Forms — Checkbox & Radio" subtitle="States: default · hover · focused · disabled" -->
<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../components/forms/Components.bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  body { margin: 0; padding: 16px 20px; background: #fff; font-family: var(--font-family-body); }
  .section { margin-bottom: 16px; }
  .section-label { font-size: 10px; font-weight: 700; color: #A0A3BD; letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 10px; }
  .row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { Checkbox3, Radios1 } = window;
function Card() {
  return (
    <div>
      <div className="section">
        <div className="section-label">Checkbox</div>
        <div className="row">
          <Checkbox3 label={true} status="inactive" state="default" text1="Unchecked" />
          <Checkbox3 label={true} status="active" state="default" text1="Checked" />
          <Checkbox3 label={true} status="indeterminate" state="default" text1="Indeterminate" />
          <Checkbox3 label={true} status="inactive" state="disabled" text1="Disabled" />
        </div>
      </div>
      <div className="section">
        <div className="section-label">Radio</div>
        <div className="row">
          <Radios1 property1="default radio" property3="enabled unselected" text1="Unselected" />
          <Radios1 property1="default radio" property3="enabled selected" text1="Selected" />
          <Radios1 property1="default radio" property3="disabled unselected" text1="Disabled" />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script>
</body></html>
