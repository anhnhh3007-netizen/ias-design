<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../../styles.css">
<style>body{margin:0;padding:16px 20px;background:#F4F6FA;font-family:var(--font-family-body);display:flex;gap:16px}
.pc{background:#fff;border-radius:8px;border:1px solid #EDF2F7;box-shadow:0 8px 24px rgba(75,99,226,.12);padding:14px 16px;width:240px}
.btn{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;border:none}
</style></head><body>
<div class="pc">
  <div style="font-size:13px;font-weight:700;color:#14142A;margin-bottom:6px">⚠ Xác nhận xóa?</div>
  <div style="font-size:12px;color:#6E7191;margin-bottom:12px">Thao tác này không thể hoàn tác.</div>
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" style="background:#fff;color:#6E7191;border:1px solid #D9DBE9">Hủy</button>
    <button class="btn" style="background:#EB2D4B;color:#fff">Xóa</button>
  </div>
</div>
</body></html>
