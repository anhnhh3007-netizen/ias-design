<!-- @dsCard group="Components" viewport="900x600" name="Drawer" subtitle="Right-side sliding detail panel, 50% viewport width — opened from a Table row via a double-chevron trigger" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<style>
body{margin:0;background:#F4F6FA;font-family:var(--font-family-body)}
.msym{font-family:'Material Symbols Outlined';font-style:normal;user-select:none;line-height:1;display:inline-block;flex-shrink:0}
/* width: 50vw (Drawer's default), floored at 480px, capped at 95vw — same as Drawer.jsx */
.drawer{position:absolute;top:0;right:0;bottom:0;width:50vw;min-width:480px;max-width:95vw;background:var(--color-bg-surface,#fff);box-shadow:-8px 0 32px rgba(20,20,42,.16);display:flex;flex-direction:column}
.dr-header{padding:20px 24px;border-bottom:1px solid var(--color-neutral-200,#EDF2F7);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.dr-title{font-size:16px;font-weight:700;color:var(--color-text-primary,#14142A)}
.dr-icon-btn{width:32px;height:32px;border-radius:6px;border:none;background:transparent;cursor:pointer;color:var(--color-icon-default,#6E7191);display:flex;align-items:center;justify-content:center}
.dr-icon-btn:hover{background:var(--color-bg-hover,#F4F5FF);color:var(--color-icon-brand,#141ED2)}
.dr-body{padding:24px;overflow-y:auto;flex:1}
.dr-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 16px}
/* dr-field = Field (components/display/Field/) — 12px/500 label, 14px/400 value + bottom divider */
.dr-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.dr-field label{font-size:12px;font-weight:500;color:var(--color-text-secondary,#6E7191)}
.dr-field .val{font-size:14px;font-weight:400;color:var(--color-text-primary,#14142A);padding-bottom:10px;border-bottom:1px solid var(--color-neutral-200,#EDF2F7);min-height:20px}
.dr-footer{padding:16px 24px;border-top:1px solid var(--color-neutral-200,#EDF2F7);display:flex;justify-content:flex-end;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;border:1px solid var(--color-primary-200,#C4C6F7);background:transparent;color:var(--color-text-primary,#14142A)}
</style></head><body>

<div class="drawer">
  <div class="dr-header">
    <span class="dr-title">CT_123 - Kiểm toán hoạt động CNTT</span>
    <div style="display:flex;align-items:center;gap:4px">
      <button class="dr-icon-btn" title="Mở rộng"><span class="msym" style="font-size:18px">open_in_full</span></button>
      <button class="dr-icon-btn" title="Đóng"><span class="msym" style="font-size:20px">close</span></button>
    </div>
  </div>
  <div class="dr-body">
    <div class="dr-grid">
      <div class="dr-field"><label>Mã chương trình</label><div class="val">CT_123</div></div>
      <div class="dr-field"><label>Tên chương trình</label><div class="val">Kiểm toán hoạt động CNTT</div></div>
      <div class="dr-field"><label>Trong/ngoài kế hoạch</label><div class="val">Ngoài kế hoạch</div></div>
      <div class="dr-field"><label>Hình thức chương trình</label><div class="val">Kiểm toán</div></div>
      <div class="dr-field"><label>Phạm vi chương trình</label><div class="val">Toàn bộ hoạt động vận hành CNTT</div></div>
      <div class="dr-field"><label>Thời gian phê duyệt</label><div class="val">14/03/2025</div></div>
      <div class="dr-field"><label>Đối tượng kiểm toán</label><div class="val">Hoạt động A; Hoạt động B; Hoạt động C</div></div>
      <div class="dr-field"><label>Đơn vị được kiểm toán</label><div class="val">CNTT; KDL; KHCN</div></div>
    </div>
  </div>
  <div class="dr-footer">
    <button class="btn">Đóng</button>
  </div>
</div>

</body></html>
