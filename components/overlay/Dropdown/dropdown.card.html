<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../../styles.css">
<style>body{margin:0;padding:12px 16px;background:#F4F6FA;font-family:var(--font-family-body);display:flex;gap:16px;align-items:flex-start}
.menu{background:#fff;border-radius:8px;border:1px solid #EDF2F7;box-shadow:0 8px 24px rgba(75,99,226,.12);overflow:hidden;min-width:160px}
.mi{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;color:#4E4B66}
.mi:hover{background:#F4F5FF}.sep{height:1px;background:#EDF2F7;margin:4px 0}
</style></head><body>
<div class="menu">
  <div class="mi">✏️ Chỉnh sửa</div>
  <div class="mi">👁 Xem chi tiết</div>
  <div class="mi">📋 Sao chép</div>
  <div class="sep"></div>
  <div class="mi" style="color:#EB2D4B">🗑 Xóa hồ sơ</div>
</div>
</body></html>
