<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../../styles.css">
<style>body{margin:0;padding:0;background:#fff;font-family:var(--font-family-body)}
.hdr{height:64px;background:#fff;border-bottom:1px solid #D9DBE9;display:flex;align-items:center;padding:0 24px;gap:12px}
.sw{position:relative;display:flex;align-items:center;flex:1;max-width:400px}
.sw input{width:100%;height:36px;border-radius:8px;border:1px solid #D9DBE9;background:#F4F6FA;padding:0 12px 0 34px;font-size:13px;font-family:inherit;color:#4E4B66;outline:none}
.si{position:absolute;left:10px;color:#A0A3BD;pointer-events:none}
.hb{width:36px;height:36px;border-radius:8px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#6E7191;position:relative}
.av{width:36px;height:36px;border-radius:50%;background:#141ED2;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;cursor:pointer}
.bdg{position:absolute;top:4px;right:4px;min-width:16px;height:16px;background:#EB2D4B;border-radius:8px;border:2px solid #fff;font-size:9px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 3px}
</style></head><body>
<div class="hdr">
  <div class="sw"><svg class="si" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><input placeholder="Tìm kiếm" /></div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <button class="hb"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></button>
    <button class="hb"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg><span class="bdg">12</span></button>
    <div class="av">NT</div>
  </div>
</div>
</body></html>
