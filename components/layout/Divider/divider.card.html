<!-- @dsCard group="Components" viewport="700x100" name="Divider" subtitle="Horizontal and labeled separators" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../../styles.css">
<style>body{margin:0;padding:12px 20px;background:#fff;font-family:var(--font-family-body);display:flex;flex-direction:column;gap:0}
.d{height:1px;background:#EDF2F7;margin:12px 0}
.dl{display:flex;align-items:center;gap:12px;margin:12px 0}
.dl::before,.dl::after{content:'';flex:1;height:1px;background:#EDF2F7}
</style></head><body>
<div style="font-size:13px;color:#4E4B66;padding:4px 0">Thông tin cá nhân</div>
<div class="d"></div>
<div style="font-size:13px;color:#4E4B66;padding:4px 0">Thông tin công tác</div>
<div class="dl"><span style="font-size:12px;font-weight:600;color:#A0A3BD;white-space:nowrap">Hoặc</span></div>
<div style="font-size:13px;color:#4E4B66;padding:4px 0">Thông tin lương thưởng</div>
<div class="d"></div>
</body></html>
