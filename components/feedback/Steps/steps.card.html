<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../../styles.css">
<style>body{margin:0;padding:14px 20px;background:#fff;font-family:var(--font-family-body);display:flex;align-items:center}
.sc{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.sl{flex:1;height:2px;min-width:20px;margin:0 8px}
.sl2{font-size:12px;font-weight:600;margin-left:6px;white-space:nowrap}
</style></head><body>
<div style="display:flex;align-items:center;gap:6px"><div class="sc" style="background:#00BA88;color:#fff">✓</div><span class="sl2" style="color:#14142A">Thông tin cơ bản</span></div>
<div class="sl" style="background:#00BA88"></div>
<div style="display:flex;align-items:center;gap:6px"><div class="sc" style="background:#141ED2;color:#fff">2</div><span class="sl2" style="color:#141ED2">Vị trí công tác</span></div>
<div class="sl" style="background:#EDF2F7"></div>
<div style="display:flex;align-items:center;gap:6px"><div class="sc" style="background:#EDF2F7;color:#A0A3BD">3</div><span class="sl2" style="color:#A0A3BD">Xác nhận</span></div>
</body></html>
