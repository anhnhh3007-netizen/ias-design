<!-- @dsCard group="Components" viewport="700x180" name="Alert · Tooltip · Spinner" subtitle="Feedback and status components" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../../styles.css">
<style>
  body { margin:0; padding:14px 18px; background:#F4F6FA; font-family:var(--font-family-body); }
  .alert { display:flex; gap:10px; padding:10px 14px; border-radius:8px; margin-bottom:8px; align-items:flex-start; }
  .ai { width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#fff; flex-shrink:0; margin-top:1px; }
  .at { font-size:13px; font-weight:700; margin-bottom:2px; }
  .ad { font-size:12px; color:#6E7191; }
  .row { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  @keyframes sp { to { transform:rotate(360deg) } }
</style></head><body>
<div class="alert" style="background:#F2FFFB;border:1px solid #00BA88">
  <div class="ai" style="background:#00BA88">✓</div>
  <div><div class="at" style="color:#00966D">Phê duyệt thành công</div><div class="ad">Hồ sơ nhân viên đã được lưu vào hệ thống.</div></div>
</div>
<div class="alert" style="background:#FFF9EF;border:1px solid #F4B740">
  <div class="ai" style="background:#F4B740">⚠</div>
  <div><div class="at" style="color:#946200">Cảnh báo</div><div class="ad">Thông tin chưa đầy đủ, vui lòng kiểm tra lại.</div></div>
</div>
<div class="row" style="margin-top:8px">
  <span style="background:#14142A;color:#fff;font-size:11px;padding:5px 10px;border-radius:6px">Xem chi tiết nhân viên</span>
  <div style="display:flex;gap:10px;align-items:center">
    <span style="width:20px;height:20px;border:2px solid #E8EAF6;border-top-color:#141ED2;border-radius:50%;animation:sp .7s linear infinite;display:inline-block"></span>
    <span style="width:28px;height:28px;border:3px solid #E8EAF6;border-top-color:#141ED2;border-radius:50%;animation:sp .7s linear infinite;display:inline-block"></span>
    <span style="width:40px;height:40px;border:4px solid #E8EAF6;border-top-color:#141ED2;border-radius:50%;animation:sp .7s linear infinite;display:inline-block"></span>
    <span style="font-size:12px;color:#6E7191">Đang tải...</span>
  </div>
</div>
</body></html>
