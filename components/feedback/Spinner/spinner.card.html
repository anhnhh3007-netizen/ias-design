<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../../styles.css">
<style>body{margin:0;padding:14px 20px;background:#fff;font-family:var(--font-family-body);display:flex;gap:20px;align-items:center}
@keyframes sp{to{transform:rotate(360deg)}}
.sp{border-radius:50%;animation:sp .7s linear infinite;display:inline-block;flex-shrink:0}
</style></head><body>
<div class="sp" style="width:16px;height:16px;border:2px solid #E8EAF6;border-top-color:#141ED2"></div>
<div class="sp" style="width:24px;height:24px;border:3px solid #E8EAF6;border-top-color:#141ED2"></div>
<div class="sp" style="width:32px;height:32px;border:3px solid #E8EAF6;border-top-color:#141ED2"></div>
<div class="sp" style="width:40px;height:40px;border:4px solid #E8EAF6;border-top-color:#141ED2"></div>
<div class="sp" style="width:24px;height:24px;border:3px solid #F2FFFB;border-top-color:#00BA88"></div>
<div class="sp" style="width:24px;height:24px;border:3px solid #FFF3F8;border-top-color:#EB2D4B"></div>
<span style="font-size:12px;color:#A0A3BD;margin-left:8px">Đang tải dữ liệu...</span>
</body></html>
