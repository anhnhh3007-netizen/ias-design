<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../../styles.css">
<style>body{margin:0;padding:12px 16px;background:#F4F6FA;font-family:var(--font-family-body);display:flex;flex-direction:column;gap:8px}
.n{display:flex;gap:10px;padding:12px 14px;border-radius:10px;align-items:flex-start;max-width:380px}
.ni{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.nt{font-size:13px;font-weight:700;margin-bottom:2px}
.nd{font-size:12px;color:#6E7191}
</style></head><body>
<div class="n" style="background:#F2FFFB;border:1px solid #00BA88;box-shadow:0 4px 12px rgba(75,99,226,.08)"><div class="ni" style="background:#00BA88">✓</div><div><div class="nt" style="color:#00966D">Lưu thành công</div><div class="nd">Thông tin nhân viên đã được cập nhật.</div></div></div>
<div class="n" style="background:#FFF9EF;border:1px solid #F4B740;box-shadow:0 4px 12px rgba(75,99,226,.08)"><div class="ni" style="background:#F4B740">⚠</div><div><div class="nt" style="color:#946200">Cảnh báo</div><div class="nd">Phiên làm việc sắp hết hạn sau 5 phút.</div></div></div>
<div class="n" style="background:#FFF3F8;border:1px solid #EB2D4B;box-shadow:0 4px 12px rgba(75,99,226,.08)"><div class="ni" style="background:#EB2D4B">✕</div><div><div class="nt" style="color:#C30052">Lỗi kết nối</div><div class="nd">Không thể lưu dữ liệu. Vui lòng thử lại.</div></div></div>
</body></html>
