<!-- @dsCard group="Components" viewport="700x60" name="Tooltip" subtitle="Hover tooltip for contextual help" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../../styles.css">
<style>body{margin:0;padding:14px 20px;background:#fff;font-family:var(--font-family-body);display:flex;gap:24px;align-items:center}
.tt{position:relative;display:inline-block}
.bubble{position:absolute;bottom:115%;left:50%;transform:translateX(-50%);background:#14142A;color:#fff;font-size:11px;padding:5px 10px;border-radius:6px;white-space:nowrap;font-family:var(--font-family-body)}
.tr{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:#141ED2;cursor:pointer;border-bottom:1px dashed #141ED2}
</style></head><body>
<div class="tt" style="margin-top:24px"><span class="tr">Mã nhân viên</span><div class="bubble">Mã định danh duy nhất trong hệ thống</div></div>
<div class="tt" style="margin-top:24px"><span class="tr">Hệ số lương</span><div class="bubble">Dựa theo thang bảng lương MB Bank</div></div>
</body></html>
