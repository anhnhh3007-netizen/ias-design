<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../../styles.css">
<style>
  body { margin:0; padding:16px; background:var(--color-bg-page); font-family:var(--font-family-body); display:flex; justify-content:flex-end; }
  .menu { background:var(--color-bg-surface); border:1px solid var(--color-border-default); border-radius:8px; box-shadow:0 8px 24px rgba(75,99,226,.12); min-width:190px; padding:4px; }
  /* Text-only — RowMenu has no icon slot at all (updated 2026-08-18) */
  .mi { display:flex; align-items:center; width:100%; padding:9px 10px; border-radius:6px; font-size:13px; font-weight:500; color:var(--color-text-body); cursor:pointer; }
  .mi:hover { background:var(--color-bg-hover); }
  /* No sep before danger — red text alone marks it destructive (updated 2026-08-18, RowMenu never renders a divider) */
  .mi.danger { color:var(--color-text-error); }
</style></head><body>
<div class="menu">
  <div class="mi">Xem chi tiết</div>
  <div class="mi">Chỉnh sửa</div>
  <div class="mi">Gửi duyệt</div>
  <div class="mi">Lịch sử thay đổi</div>
  <div class="mi danger">Xóa</div>
</div>
</body></html>
