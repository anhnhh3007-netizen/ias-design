<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../../styles.css">
<style>
  body { margin:0; padding:12px; background:var(--color-bg-page); font-family:var(--font-family-body); }
  /* Card surface: white bg, no border, no shadow, no radius — square-cornered, borderless (updated 2026-08-18) */
  .wrap { background:var(--color-bg-surface); border:none; border-radius:0; overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  thead tr { background:var(--color-bg-page); }
  /* Header row: sentence case, no text-transform/letter-spacing (updated 2026-08-21 — retired
     Table's former uppercase exception, see component-rules.md cross-cutting rule + table.md).
     Still not mapped to the generic type scale (11px has no declared scale). No border (2026-08-18) */
  th { padding:10px 14px; text-align:left; font-size:11px; font-weight:700; color:var(--color-text-secondary); border:none; }
  /* Full grid: every cell bordered on all 4 sides at 0.5px (border-collapse merges shared edges into single lines) */
  td { padding:11px 14px; color:var(--color-text-body); border:0.5px solid var(--color-border-default); vertical-align:middle; }
  /* .av background/text mirrors Avatar.jsx's own internal COLORS palette — component-internal, exempt from token mapping (same exemption as Badge below) */
  .av { width:28px; height:28px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#fff; margin-right:8px; vertical-align:middle; }
  /* .st pill bg/text mirrors Badge.jsx's variant palette exactly — component-internal, exempt. Dot uses the -solid/icon-muted tokens per the two-tone dot+pill convention already established in shipped screens (e.g. can-cu-xu-phat-ias-redesign.html) */
  .st { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:9999px; font-size:11px; font-weight:600; }
  .st::before { content:''; width:6px; height:6px; border-radius:50%; }
  .td-link { color:var(--color-text-link); cursor:pointer; }
  /* Row-selection checkbox — same 18px visual as components/forms/Checkbox */
  .cb { position:relative; width:18px; height:18px; display:inline-flex; }
  .cb input { position:absolute; opacity:0; width:0; height:0; }
  .cb .box { display:flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:4px; border:2px solid var(--color-border-strong); background:var(--color-bg-surface); }
  .cb input:checked + .box, .cb.indeterminate .box { border-color:var(--color-border-focus); background:var(--color-bg-brand); }
  .cb .chk { stroke:var(--color-icon-inverse); }
</style></head><body>
<div class="wrap">
<table>
  <thead><tr>
    <th style="width:40px"><label class="cb indeterminate"><input type="checkbox" /><span class="box"><span style="width:8px;height:2px;background:var(--color-icon-inverse);border-radius:1px"></span></span></label></th>
    <th>Nhân viên</th><th>Phòng ban</th><th>Chức danh</th><th>Trạng thái</th><th>Thao tác</th>
  </tr></thead>
  <tbody class="hcm-body2">
    <tr><td><label class="cb"><input type="checkbox" checked /><span class="box"><svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path class="chk" d="M1 4L3.5 6.5L9 1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></label></td><td><span class="av" style="background:#141ED2">NA</span>Nguyễn Văn An</td><td>Phòng Kế toán</td><td>Kế toán trưởng</td><td><span class="st" style="background:var(--color-bg-success);color:var(--color-text-success)"><span style="background:var(--color-bg-success-solid);width:6px;height:6px;border-radius:50%"></span>Đang làm việc</span></td><td class="td-link">Xem ›</td></tr>
    <tr><td><label class="cb"><input type="checkbox" /><span class="box"></span></label></td><td><span class="av" style="background:#7B61FF">TB</span>Trần Thị Bích</td><td>Phòng Nhân sự</td><td>Chuyên viên NS</td><td><span class="st" style="background:var(--color-bg-warning);color:var(--color-text-warning)"><span style="background:var(--color-bg-warning-solid);width:6px;height:6px;border-radius:50%"></span>Chờ duyệt</span></td><td class="td-link">Xem ›</td></tr>
    <tr><td><label class="cb"><input type="checkbox" checked /><span class="box"><svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path class="chk" d="M1 4L3.5 6.5L9 1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></label></td><td><span class="av" style="background:#EB2D4B">HE</span>Hoàng Văn Em</td><td>Phòng Pháp chế</td><td>Chuyên viên</td><td><span class="st" style="background:var(--color-bg-page);color:var(--color-text-secondary)"><span style="background:var(--color-icon-muted);width:6px;height:6px;border-radius:50%"></span>Đã nghỉ</span></td><td class="td-link">Xem ›</td></tr>
  </tbody>
</table>
</div>
</body></html>
