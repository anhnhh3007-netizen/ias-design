<!-- @dsCard group="Components" viewport="700x260" name="ToolbarSimple" subtitle="Single-line search bar above a list/table — collapses into FilterCard, or into a bulk-selection bar, on demand · sizes S/M/L (added 2026-08-27)" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<style>
body{margin:0;padding:12px;background:#F4F6FA;font-family:var(--font-family-body)}
.msym{font-family:'Material Symbols Outlined';font-style:normal;user-select:none;line-height:1;display:inline-block;flex-shrink:0}
.tbs{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tbs + .tbs{margin-top:12px}
.tbs-search{position:relative;display:flex;align-items:center;width:320px;flex-shrink:0}
.tbs-search .msym{position:absolute;left:10px;color:var(--color-icon-muted,#A0A3BD);font-size:16px;pointer-events:none}
.tbs-search input{width:100%;height:40px;border:1px solid var(--color-border-default,#D9DBE9);border-radius:8px;background:var(--color-bg-surface,#fff);padding:0 12px 0 34px;font-size:13px;font-family:inherit;color:var(--color-text-body,#4E4B66);outline:none;transition:border-color .15s}
.tbs-search input:focus{border-color:var(--color-border-focus,#141ED2);box-shadow:0 0 0 3px rgba(20,30,210,.08)}
/* Button — synced 2026-07-23 with components/forms/Button (Figma IDS_WEB node 4901:33217)
   and the ToolbarSimple closed action table in component-rules.md: rows 2-4 are
   `outline` (not the old `ghost`), matching FilterCard's parallel actions. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 var(--space-button-px,16px);border-radius:8px;font-size:14px;font-weight:var(--font-weight-semibold,600);cursor:pointer;font-family:inherit;border:none;white-space:nowrap}
.btn-primary{background:var(--color-bg-brand,#141ED2);color:var(--color-text-inverse,#fff)}
.btn-primary:hover{background:var(--color-primary-700,#0E15A8)}
.btn-outline{background:transparent;color:var(--color-text-primary,#14142A);border:1px solid var(--color-primary-200,#C4C6F7)}
.btn-outline:hover{border-color:var(--color-border-focus,#141ED2)}
.btn-outline:disabled{border-color:#9AA1BC;color:#7F7F7F;cursor:not-allowed}
.btn-icon{width:40px;height:40px;padding:0;border-radius:8px;border:1px solid var(--color-primary-200,#C4C6F7);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--color-text-primary,#14142A)}
.btn-icon:hover{border-color:var(--color-border-focus,#141ED2)}
.sel-label{font-size:13px;font-weight:var(--font-weight-semibold,600);color:var(--color-text-primary,#14142A);white-space:nowrap}
</style></head><body>

<!-- Default state -->
<div class="tbs">
  <div class="tbs-search">
    <span class="msym" style="font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">search</span>
    <input placeholder="Tìm kiếm" />
  </div>
  <button class="btn btn-primary">
    <span class="msym" style="font-size:16px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">search</span>
    Tìm kiếm
  </button>
  <button class="btn btn-outline">
    <span class="msym" style="font-size:16px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">tune</span>
    Tìm kiếm nâng cao
  </button>
  <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
    <button class="btn btn-outline">
      <span class="msym" style="font-size:16px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">file_download</span>
      Export
    </button>
    <button class="btn-icon" title="Tuỳ chỉnh cột">
      <span class="msym" style="font-size:19px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24">settings</span>
    </button>
  </div>
</div>

<!-- selectedCount > 0 — selection summary + selectionActions insert to the LEFT
     of extraActions (Export/settings); extraActions itself stays visible, unchanged -->
<div class="tbs">
  <div class="tbs-search">

  </button>
  <button class="btn btn-outline">
    <span class="msym" style="font-size:16px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">tune</span>
    Tìm kiếm nâng cao
  </button>
  <div style="margin-left:auto;display:flex;align-items:center;gap:12px">
    <span class="sel-label">Đã chọn 5 vai trò</span>

      <span class="msym" style="font-size:16px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">delete</span>

    </button>
    <button class="btn-icon" title="Tuỳ chỉnh cột">
      <span class="msym" style="font-size:19px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24">settings</span>
    </button>
  </div>
</div>

<!-- Fuller composition (updated 2026-08-14) — trailing cluster is one fixed left→right order,
     but which items appear is per-screen: this example shows a workflow-heavy list (Xóa/Hủy/Gửi
     duyệt disabled at n=0, Import + Export + settings always visible). A screen only needs the
     subset it actually uses — see the closed order table in component-rules.md's ToolbarSimple
     section for the full 7-row sequence this is demonstrating. -->
<div class="tbs">
  <div class="tbs-search">
    <span class="msym" style="font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">search</span>
    <input placeholder="Tìm kiếm" />
  </div>
  <button class="btn btn-primary">
    <span class="msym" style="font-size:16px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">search</span>
    Tìm kiếm
  </button>
  <button class="btn btn-outline">
    <span class="msym" style="font-size:16px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">tune</span>
    Tìm kiếm nâng cao
  </button>
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <span class="sel-label">Đã chọn 0 bản ghi</span>
    <button class="btn btn-outline" disabled>
      <span class="msym" style="font-size:16px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">delete</span>
      Xóa
    </button>
    <button class="btn btn-outline" disabled>
      <span class="msym" style="font-size:16px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">block</span>
      Hủy
    </button>
    <button class="btn btn-outline" disabled>
      <span class="msym" style="font-size:16px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">send</span>
      Gửi duyệt
    </button>
    <button class="btn btn-outline">
      <span class="msym" style="font-size:16px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">file_upload</span>
      Import
    </button>
    <button class="btn btn-outline">
      <span class="msym" style="font-size:16px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20">file_download</span>
      Export
    </button>
    <button class="btn-icon" title="Tuỳ chỉnh cột">
      <span class="msym" style="font-size:19px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24">settings</span>
    </button>
  </div>
</div>

<div class="tbs">

  <button class="btn btn-outline" style="height:32px;font-size:14px">

  <button class="btn btn-outline" style="height:48px;font-size:16px">

</body></html>
