<!-- @dsCard group="Components" viewport="700x120" name="Tabs & Steps" subtitle="Tab navigation and step progress" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../../styles.css">
<style>
  body { margin:0; padding:16px 20px; background:#fff; font-family:var(--font-family-body); }
  .tabs { display:flex; border-bottom:2px solid #EDF2F7; margin-bottom:16px; }
  .tab { padding:8px 18px; font-size:13px; font-weight:500; color:#6E7191; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; white-space:nowrap; }
  .tab.on { color:#141ED2; font-weight:700; border-bottom-color:#141ED2; }
  .steps { display:flex; align-items:center; }
  .sc { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; }
  .sl { flex:1; height:2px; min-width:20px; margin:0 8px; }
  .slabel { font-size:12px; font-weight:600; margin-left:6px; white-space:nowrap; }
</style></head><body>
<div class="tabs">
  <div class="tab on">Tất cả <span style="background:#141ED2;color:#fff;border-radius:9999px;font-size:10px;padding:1px 6px;margin-left:4px">1248</span></div>
  <div class="tab">Đang làm việc</div>
  <div class="tab">Chờ phê duyệt <span style="background:#F4B740;color:#fff;border-radius:9999px;font-size:10px;padding:1px 6px;margin-left:4px">23</span></div>
  <div class="tab">Đã nghỉ</div>
</div>
<div class="steps">
  <div style="display:flex;align-items:center;gap:6px"><div class="sc" style="background:#00BA88;color:#fff">✓</div><span class="slabel" style="color:#14142A">Thông tin cơ bản</span></div>
  <div class="sl" style="background:#00BA88"></div>
  <div style="display:flex;align-items:center;gap:6px"><div class="sc" style="background:#141ED2;color:#fff">2</div><span class="slabel" style="color:#141ED2">Vị trí công tác</span></div>
  <div class="sl" style="background:#EDF2F7"></div>
  <div style="display:flex;align-items:center;gap:6px"><div class="sc" style="background:#EDF2F7;color:#A0A3BD">3</div><span class="slabel" style="color:#A0A3BD">Xác nhận</span></div>
</div>
</body></html>
