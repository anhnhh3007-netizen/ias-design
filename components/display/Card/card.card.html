<!-- @dsCard group="Components" viewport="700x160" name="Card" subtitle="Surface card with header, body and footer" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../../styles.css">
<style>body{margin:0;padding:12px;background:#F4F6FA;font-family:var(--font-family-body);display:flex;gap:12px}
.card{background:#fff;border-radius:12px;border:1px solid #D9DBE9;overflow:hidden;flex:1}
.ch{padding:14px 16px;border-bottom:1px solid #EDF2F7;display:flex;justify-content:space-between;align-items:center}
.ct{font-size:14px;font-weight:700;color:#14142A}
.cs{font-size:12px;color:#A0A3BD;margin-top:2px}
.cb{padding:14px 16px;font-size:13px;color:#6E7191;line-height:1.6}
.cf{padding:10px 16px;border-top:1px solid #EDF2F7;background:#F4F6FA;display:flex;justify-content:flex-end;gap:8px}
.btn{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;border:none}
</style></head><body>
<div class="card">
  <div class="ch"><div><div class="ct">Thông tin nhân viên</div><div class="cs">Cập nhật lần cuối: 01/06/2026</div></div><span style="color:#141ED2;font-size:12px;cursor:pointer">Chỉnh sửa</span></div>
  <div class="cb">Họ tên: Nguyễn Văn An<br>Phòng ban: Kế toán<br>Chức danh: Kế toán trưởng</div>
  <div class="cf"><button class="btn" style="background:#fff;color:#6E7191;border:1px solid #D9DBE9">Hủy</button><button class="btn" style="background:#141ED2;color:#fff">Lưu</button></div>
</div>
<div class="card">
  <div class="ch"><div class="ct">Thống kê tháng 6</div></div>
  <div class="cb" style="display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;justify-content:space-between"><span>Nhân viên mới</span><span style="font-weight:700;color:#141ED2">12</span></div>
    <div style="display:flex;justify-content:space-between"><span>Nghỉ việc</span><span style="font-weight:700;color:#EB2D4B">4</span></div>
    <div style="display:flex;justify-content:space-between"><span>Đang thử việc</span><span style="font-weight:700;color:#F4B740">8</span></div>
  </div>
</div>
</body></html>
