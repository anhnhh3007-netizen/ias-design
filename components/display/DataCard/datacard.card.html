<!-- @dsCard group="Components" viewport="700x120" name="DataCard" subtitle="KPI metric cards with icon and change" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../../../styles.css">
<style>body{margin:0;padding:12px;background:#F4F6FA;font-family:var(--font-family-body);display:flex;gap:12px}
.dc{flex:1;background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(75,99,226,.08)}
.ic{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:10px}
.lbl{font-size:11px;font-weight:500;color:#6E7191;margin-bottom:4px}
.val{font-size:24px;font-weight:700;line-height:1;margin-bottom:4px}
.ch{font-size:11px}
</style></head><body>
<div class="dc"><div class="ic" style="background:#E8EAF6">👥</div><div class="lbl">Tổng nhân viên</div><div class="val" style="color:#141ED2">1,248</div><div class="ch" style="color:#141ED2">+12 tháng này</div></div>
<div class="dc"><div class="ic" style="background:#F2FFFB">✅</div><div class="lbl">Đang làm việc</div><div class="val" style="color:#00966D">1,187</div><div class="ch" style="color:#00966D">95.1% tổng số</div></div>
<div class="dc"><div class="ic" style="background:#FFF9EF">⏳</div><div class="lbl">Chờ phê duyệt</div><div class="val" style="color:#946200">23</div><div class="ch" style="color:#946200">3 cần xử lý gấp</div></div>
<div class="dc"><div class="ic" style="background:#FFF3F8">📤</div><div class="lbl">Đã nghỉ việc</div><div class="val" style="color:#EB2D4B">38</div><div class="ch" style="color:#EB2D4B">Tháng 6/2026</div></div>
</body></html>
